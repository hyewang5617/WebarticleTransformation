<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>웹기사 HTML 변환기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 16px; font-weight: 700; }
    header p { font-size: 12px; color: #888; margin-top: 2px; }

    .legend {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #ccc;
    }
    .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .panel-header h2 { font-size: 13px; font-weight: 700; color: #333; }

    textarea#inputArea {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      font-size: 13px;
      line-height: 1.8;
      padding: 14px 16px;
      color: #333;
      min-height: 0;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }
    .tab-btn {
      padding: 8px 16px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      color: #888;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab-btn.active { color: #1a1a2e; border-bottom-color: #1a1a2e; font-weight: 700; }

    .tab-panel { display: none; flex: 1; overflow-y: auto; min-height: 0; }
    .tab-panel.active { display: flex; flex-direction: column; }

    /* 분석 탭 */
    .analysis-list {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .analysis-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 3px 0;
    }
    .type-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 3px;
      flex-shrink: 0;
      min-width: 52px;
      text-align: center;
    }
    .analysis-text { font-size: 12px; color: #333; line-height: 1.5; }

    .badge-heading { background: #0277BD; color: white; }
    .badge-body    { background: #eee; color: #555; }
    .badge-byline  { background: #6A1B9A; color: white; }
    .badge-caption { background: #2E7D32; color: white; }

    /* 미리보기 탭 */
    #previewContent { padding: 16px 20px; max-width: 780px; }

    /* 미리보기에서 소제목은 CSS 마진으로 위아래 공간 표현 */
    .prev-heading {
      font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
      font-size: 18pt;
      font-weight: bold;
      color: #000;
      margin-top: 2.8em;
      margin-bottom: 1.4em;
      line-height: 1.5;
    }
    .prev-body {
      font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
      font-size: 14pt;
      color: #000;
      line-height: 1.8;
      text-indent: 1em;
      margin-bottom: 4px;
    }
    .prev-byline {
      font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
      font-size: 14pt;
      font-weight: bold;
      color: #000;
      text-align: right;
      margin-top: 1.6em;
    }
    .prev-caption {
      font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
      font-size: 12pt;
      color: #000;
      margin-bottom: 4px;
    }

    /* HTML 탭 */
    textarea#htmlOutput {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.6;
      padding: 14px 16px;
      color: #333;
      background: #f8f9fa;
      min-height: 0;
    }

    /* 버튼 */
    .btn {
      padding: 6px 12px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-primary { background: #1a1a2e; color: white; }
    .btn-primary:hover { background: #2d2d50; }
    .btn-success { background: #2E7D32; color: white; }
    .btn-success:hover { background: #1B5E20; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    .copy-msg { font-size: 11px; color: #2E7D32; opacity: 0; transition: opacity 0.3s; }
    .copy-msg.show { opacity: 1; }

    /* 옵션 바 */
    .options-bar {
      padding: 7px 14px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      background: #fafafa;
    }
    .options-bar label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: #555;
      cursor: pointer;
    }

    .hint {
      font-size: 11px;
      color: #aaa;
      padding: 6px 14px;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📰 웹기사 HTML 변환기</h1>
    <p>맑은고딕 · 소제목 18pt · 본문 14pt 들여쓰기 · 캡션 12pt · 바이라인 bold 우측</p>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#0277BD"></div>소제목</div>
    <div class="legend-item"><div class="legend-dot" style="background:#aaa"></div>본문</div>
    <div class="legend-item"><div class="legend-dot" style="background:#6A1B9A"></div>바이라인</div>
    <div class="legend-item"><div class="legend-dot" style="background:#2E7D32"></div>캡션</div>
  </div>
</header>

<div class="main">

  <!-- 왼쪽: 입력 -->
  <div class="panel">
    <div class="panel-header">
      <h2>✏️ 기사 원문 붙여넣기</h2>
      <button class="btn btn-primary" onclick="convert()">변환 →</button>
    </div>
    <div class="hint">
      기사 본문을 그대로 붙여넣으세요 (제목 제외) &nbsp;|&nbsp;
      <strong>짧은 줄 + 앞 빈 줄</strong> → 소제목 &nbsp;·&nbsp;
      <strong>기자/이메일</strong> → 바이라인
      &nbsp;|&nbsp; <kbd>Ctrl+Enter</kbd> 변환
    </div>
    <textarea id="inputArea" placeholder="여기에 기사 본문을 붙여넣으세요.

공릉동은 우리대학 학생들에게 익숙한 공간이다...

익숙한 공릉동, 낯선 지역 소식

우리대학 학생들이 공릉동의 생활 정보나...

양혜정 수습기자
hjysheep@seoultech.ac.kr"></textarea>
  </div>

  <!-- 오른쪽: 출력 -->
  <div class="panel">
    <div class="panel-header">
      <h2>📄 변환 결과</h2>
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="copy-msg" id="copyMsg">✓ 복사됨!</span>
        <button class="btn btn-success btn-sm" onclick="copyHTML()">HTML 복사</button>
      </div>
    </div>

    <div class="options-bar">
      <label>
        <input type="checkbox" id="autoConvert" checked>
        붙여넣기 시 자동 변환
      </label>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="analysis" onclick="switchTab('analysis')">🔍 분석 결과</button>
      <button class="tab-btn" data-tab="preview" onclick="switchTab('preview')">👁 미리보기</button>
      <button class="tab-btn" data-tab="html" onclick="switchTab('html')">💾 HTML 코드</button>
    </div>

    <div class="tab-panel active" id="tab-analysis">
      <div class="analysis-list" id="analysisList">
        <p style="color:#aaa; font-size:12px; margin-top:20px;">기사를 붙여넣고 <strong>변환</strong>을 누르면 각 줄이 어떻게 분류됐는지 보여줍니다.</p>
      </div>
    </div>

    <div class="tab-panel" id="tab-preview">
      <div id="previewContent">
        <p style="color:#aaa; font-size:12px; margin-top:20px;">미리보기가 여기에 표시됩니다.</p>
      </div>
    </div>

    <div class="tab-panel" id="tab-html">
      <textarea id="htmlOutput" readonly placeholder="HTML 코드가 여기에 표시됩니다."></textarea>
    </div>
  </div>
</div>

<script>
/* ─── 스타일 상수 ─── */
const S = {
  heading: "font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 18pt; font-weight: bold; color: #000000;",
  body:    "font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 14pt; color: #000000; line-height: 1.8; text-indent: 1em;",
  byline:  "font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 14pt; font-weight: bold; color: #000000; text-align: right;",
  caption: "font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 12pt; color: #000000;",
  blank:   "font-family: '맑은 고딕', 'Malgun Gothic', sans-serif; font-size: 14pt; color: #000000; line-height: 1.8;",
};

/* ─── 파싱 ─── */
function parseArticle(text) {
  const rawLines = text.split('\n');
  const lines = rawLines.map(l => l.trim());
  const result = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // 빈 줄
    if (!line) {
      result.push({ type: 'empty', text: '' });
      continue;
    }

    // 수동 마커 지원 (## @ ^ 형식도 동작)
    if (line.startsWith('## ')) {
      result.push({ type: 'heading', text: line.slice(3).trim() });
      continue;
    }
    if (line.startsWith('@')) {
      result.push({ type: 'byline', text: line.slice(1).trim() });
      continue;
    }
    if (/^\^( |$)/.test(line)) {
      result.push({ type: 'caption', text: line.replace(/^\^( )?/, '').trim() });
      continue;
    }

    // 이메일 → 바이라인
    if (/^[\w.+%-]+@[\w.-]+\.[a-z]{2,}$/i.test(line)) {
      result.push({ type: 'byline', text: line });
      continue;
    }

    // 짧은 줄에 기자/에디터/편집장 포함 → 바이라인
    const BYLINE_WORDS = ['기자', '에디터', '편집장', '부장', '차장'];
    if (line.length <= 30 && BYLINE_WORDS.some(w => line.includes(w))) {
      result.push({ type: 'byline', text: line });
      continue;
    }

    // 소제목: i > 0 이고, 앞 줄이 비어있고, 25자 이하
    const prevEmpty = i > 0 && !lines[i - 1];
    if (prevEmpty && line.length <= 25) {
      result.push({ type: 'heading', text: line });
      continue;
    }

    // 나머지 = 본문
    result.push({ type: 'body', text: line });
  }

  return result;
}

/* ─── HTML 생성 ─── */
function esc(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

const BLANK = () => `<p style="${S.blank}">&nbsp;</p>`;

function generateHTML(parsed) {
  const parts = [];
  let bylineBuf = [];
  let bylineFlushed = false;

  function flushByline() {
    if (!bylineBuf.length) return;
    // 바이라인 앞에 빈 줄 1개
    parts.push(BLANK());
    const html = bylineBuf.map(esc).join('<br>');
    parts.push(`<p style="${S.byline}">${html}</p>`);
    bylineBuf = [];
    bylineFlushed = true;
  }

  for (const item of parsed) {
    if (item.type === 'empty') { flushByline(); continue; }
    if (item.type === 'byline') { bylineBuf.push(item.text); continue; }

    flushByline();

    if (item.type === 'heading') {
      // 소제목 위에 빈 줄 2개
      parts.push(BLANK());
      parts.push(BLANK());
      parts.push(`<p style="${S.heading}">${esc(item.text)}</p>`);
      // 소제목 아래에 빈 줄 2개
      parts.push(BLANK());
      parts.push(BLANK());
    } else if (item.type === 'caption') {
      parts.push(`<p style="${S.caption}">${esc(item.text)}</p>`);
    } else if (item.type === 'body') {
      parts.push(`<p style="${S.body}">${esc(item.text)}</p>`);
    }
  }

  flushByline();
  return parts.join('\n');
}

/* ─── 미리보기 생성 ─── */
function generatePreview(parsed) {
  const parts = [];
  let bylineBuf = [];

  function flushByline() {
    if (!bylineBuf.length) return;
    const html = bylineBuf.map(esc).join('<br>');
    parts.push(`<p class="prev-byline">${html}</p>`);
    bylineBuf = [];
  }

  for (const item of parsed) {
    if (item.type === 'empty') { flushByline(); continue; }
    if (item.type === 'byline') { bylineBuf.push(item.text); continue; }

    flushByline();

    if (item.type === 'heading') {
      parts.push(`<p class="prev-heading">${esc(item.text)}</p>`);
    } else if (item.type === 'caption') {
      parts.push(`<p class="prev-caption">${esc(item.text)}</p>`);
    } else if (item.type === 'body') {
      parts.push(`<p class="prev-body">${esc(item.text)}</p>`);
    }
  }

  flushByline();
  return parts.join('\n');
}

/* ─── 분석 결과 뷰 ─── */
const BADGE = {
  heading: ['badge-heading', '소제목'],
  body:    ['badge-body',    '본문'],
  byline:  ['badge-byline',  '바이라인'],
  caption: ['badge-caption', '캡션'],
};

function generateAnalysis(parsed) {
  const listEl = document.getElementById('analysisList');
  listEl.innerHTML = '';

  let bylineBuf = [];

  function flushByline() {
    if (!bylineBuf.length) return;
    const div = document.createElement('div');
    div.className = 'analysis-item';
    div.innerHTML = `<span class="type-badge badge-byline">바이라인</span>
      <span class="analysis-text">${bylineBuf.map(esc).join(' / ')}</span>`;
    listEl.appendChild(div);
    bylineBuf = [];
  }

  for (const item of parsed) {
    if (item.type === 'empty') { flushByline(); continue; }
    if (item.type === 'byline') { bylineBuf.push(item.text); continue; }

    flushByline();

    const [badgeClass, label] = BADGE[item.type] || ['badge-body', '본문'];

    const div = document.createElement('div');
    div.className = 'analysis-item';
    const displayText = item.text.length > 60 ? item.text.slice(0, 58) + '…' : item.text;
    div.innerHTML = `<span class="type-badge ${badgeClass}">${label}</span>
      <span class="analysis-text">${esc(displayText)}</span>`;
    listEl.appendChild(div);
  }

  flushByline();
}

/* ─── 메인 변환 ─── */
function convert() {
  const text = document.getElementById('inputArea').value;
  if (!text.trim()) return;

  const parsed = parseArticle(text);

  generateAnalysis(parsed);
  document.getElementById('previewContent').innerHTML = generatePreview(parsed);
  document.getElementById('htmlOutput').value = generateHTML(parsed);
}

/* ─── 탭 전환 ─── */
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
}

/* ─── HTML 복사 ─── */
function copyHTML() {
  const html = document.getElementById('htmlOutput').value;
  if (!html) return;
  navigator.clipboard.writeText(html).then(() => {
    const msg = document.getElementById('copyMsg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 2000);
  });
}

/* ─── 단축키 & 자동 변환 ─── */
document.getElementById('inputArea').addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') convert();
});

document.getElementById('inputArea').addEventListener('paste', () => {
  setTimeout(() => {
    if (document.getElementById('autoConvert').checked) convert();
  }, 50);
});
</script>
</body>
</html>
